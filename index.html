<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wealth OS">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F4EE">
<title>Wealth & Life OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EE;
  --panel:#FFFFFF;
  --ink:#161C16;
  --ink-soft:#5B6459;
  --line:#E1DFD3;
  --evergreen:#1B4332;
  --evergreen-dim:#2D5A45;
  --gold:#A9812F;
  --gold-soft:#F1E6C8;
  --danger:#9A3B3B;
  --radius:2px;
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Inter',sans-serif;
  padding:0;
}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px 60px;}
.hero{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:22px;}
.hero h1{font-family:'Fraunces',serif;font-weight:700;font-size:32px;margin:0;letter-spacing:-0.01em;}
.hero .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--evergreen);margin-bottom:4px;}
.hero .date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}

.tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--line);}
.tab{
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;
  padding:10px 16px;cursor:pointer;color:var(--ink-soft);border-bottom:2px solid transparent;
  text-transform:uppercase;
}
.tab.active{color:var(--evergreen);border-bottom:2px solid var(--evergreen);}

.panel{display:none;}
.panel.active{display:block;}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.stat{background:var(--panel);border:1px solid var(--line);padding:16px;}
.stat .k{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
.stat .v{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin-top:6px;color:var(--evergreen);}
.stat .v.neg{color:var(--danger);}

.card{background:var(--panel);border:1px solid var(--line);padding:18px 20px;margin-bottom:16px;}
.card h2{font-family:'Fraunces',serif;font-size:18px;margin:0 0 12px;font-weight:600;}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);}
.row:last-child{border-bottom:none;}
.row label{flex:1;font-size:13px;}
.row input[type=text],.row input[type=number],.row input[type=date],.row select{
  font-family:'IBM Plex Mono',monospace;font-size:13px;border:1px solid var(--line);
  padding:6px 8px;background:#FCFBF8;width:120px;color:var(--ink);
}
.row input[type=text]{width:180px;}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--evergreen);}
.small-btn{
  font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  background:var(--evergreen);color:#fff;border:none;padding:8px 14px;cursor:pointer;
}
.small-btn.ghost{background:transparent;color:var(--evergreen);border:1px solid var(--evergreen);}
.small-btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.add-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.bar-track{background:#EDEBE1;height:8px;border-radius:0;flex:1;overflow:hidden;}
.bar-fill{background:var(--gold);height:100%;}
.hint{font-size:11px;color:var(--ink-soft);margin-top:8px;font-style:italic;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.days-row{display:grid;grid-template-columns:1.4fr repeat(7,32px) 50px;gap:4px;align-items:center;padding:5px 0;font-size:12px;}
.days-row.head{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);text-transform:uppercase;}
.days-row input[type=checkbox]{width:16px;height:16px;}
.pct{font-family:'IBM Plex Mono',monospace;text-align:right;}
.status-pill{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:12px;text-transform:uppercase;}
.status-complete{background:#DCEEDF;color:var(--evergreen);}
.status-ontrack{background:var(--gold-soft);color:var(--gold);}
.status-behind{background:#F3E0E0;color:var(--danger);}
.loading{padding:40px;text-align:center;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <div class="eyebrow">Wealth & Life OS</div>
      <h1>Dashboard</h1>
    </div>
    <div class="date" id="todayDate"></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="overview">Overview</div>
    <div class="tab" data-tab="budget">Budget</div>
    <div class="tab" data-tab="networth">Net Worth</div>
    <div class="tab" data-tab="goals">Goals</div>
    <div class="tab" data-tab="habits">Habits</div>
  </div>

  <div id="app" class="loading">Loading your data…</div>
</div>

<script>
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const fmt = n => (n<0?'-':'') + '$' + Math.abs(Math.round(n)).toLocaleString();
const uid = () => Math.random().toString(36).slice(2,9);

$('#todayDate').textContent = new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});

let state = {
  income: 5200,
  expenses: [
    {id:uid(),name:'Rent',amt:800},
    {id:uid(),name:'Electricity',amt:150},
    {id:uid(),name:'Health Insurance',amt:182},
    {id:uid(),name:'Internet',amt:54},
    {id:uid(),name:'Phone/Subscriptions',amt:224},
    {id:uid(),name:'Transport',amt:150},
    {id:uid(),name:'Groceries',amt:200},
    {id:uid(),name:'Health',amt:120},
    {id:uid(),name:'Dance/Pilates',amt:150},
    {id:uid(),name:'Eating out/Fun/Self-care/etc',amt:667},
    {id:uid(),name:'Debt repayment (ANZ/LAT)',amt:400},
    {id:uid(),name:'Richard (personal loan)',amt:278},
    {id:uid(),name:'Nuvoli transfer',amt:925},
  ],
  assets: [
    {id:uid(),name:'Cash & Checking',amt:0},
    {id:uid(),name:'Raiz — main',amt:438.37},
    {id:uid(),name:'Raiz — family jars (6)',amt:330},
    {id:uid(),name:'Nuvoli Plaza (paid to date)',amt:23297},
    {id:uid(),name:'Raíces R1 deposit',amt:4480},
    {id:uid(),name:'Raíces R2 deposit (share)',amt:1493},
    {id:uid(),name:'Retirement (Super, ~12%)',amt:0},
  ],
  liabilities: [
    {id:uid(),name:'ANZ Card (0%, ~30mo)',amt:8333.61},
    {id:uid(),name:'LAT Card (interest-bearing)',amt:3880},
    {id:uid(),name:'Richard (personal, 0%)',amt:973},
  ],
  goals: [
    {id:uid(),name:'Pay-Delay Buffer',target:6625,current:0,date:''},
    {id:uid(),name:'3-Month Emergency Fund',target:9642,current:0,date:''},
    {id:uid(),name:'6-Month Emergency Fund',target:19282,current:0,date:''},
    {id:uid(),name:'Net Worth Target (10yr, moderate)',target:220000,current:0,date:''},
  ],
  habits: [
    {id:uid(),name:'Exercise',days:[false,false,false,false,false,false,false]},
    {id:uid(),name:'Sleep 7+ hrs',days:[false,false,false,false,false,false,false]},
    {id:uid(),name:'Budget check-in',days:[false,false,false,false,false,false,false]},
  ]
};

async function save(){
  try{ localStorage.setItem('lifeos-state', JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); }
}
async function load(){
  try{
    const r = localStorage.getItem('lifeos-state');
    if(r) state = JSON.parse(r);
  }catch(e){ /* no existing data yet, use defaults */ }
}

function totalExpenses(){ return state.expenses.reduce((s,e)=>s+Number(e.amt||0),0); }
function totalAssets(){ return state.assets.reduce((s,a)=>s+Number(a.amt||0),0); }
function totalLiab(){ return state.liabilities.reduce((s,l)=>s+Number(l.amt||0),0); }
function netWorth(){ return totalAssets()-totalLiab(); }
function netCash(){ return Number(state.income||0)-totalExpenses(); }
function habitPct(){
  if(!state.habits.length) return 0;
  let done=0,total=0;
  state.habits.forEach(h=>h.days.forEach(d=>{total++; if(d) done++;}));
  return total? done/total : 0;
}

function render(){
  const app = $('#app');
  app.className='';
  app.innerHTML = `
    <div class="panel active" id="panel-overview">
      <div class="grid">
        <div class="stat"><div class="k">Net Worth</div><div class="v ${netWorth()<0?'neg':''}">${fmt(netWorth())}</div></div>
        <div class="stat"><div class="k">Monthly Net Cash Flow</div><div class="v ${netCash()<0?'neg':''}">${fmt(netCash())}</div></div>
        <div class="stat"><div class="k">Habit Completion</div><div class="v">${Math.round(habitPct()*100)}%</div></div>
      </div>
      <div class="card">
        <h2>Goals at a glance</h2>
        ${state.goals.map(g=>{
          const pct = g.target>0 ? Math.min(g.current/g.target,1):0;
          return `<div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
              <span>${g.name||'Untitled goal'}</span><span class="pct">${Math.round(pct*100)}%</span>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct*100}%"></div></div>
          </div>`;
        }).join('') || '<div class="hint">Add goals in the Goals tab.</div>'}
      </div>
      <div class="hint">This dashboard is for quick check-ins. Use your Wealth_Life_OS.xlsx workbook for full monthly bookkeeping.</div>
    </div>

    <div class="panel" id="panel-budget">
      <div class="card">
        <h2>Monthly Income</h2>
        <div class="row"><label>Total monthly income</label><input type="number" id="incomeInput" value="${state.income}"></div>
      </div>
      <div class="card">
        <h2>Expenses</h2>
        <div id="expenseRows"></div>
        <div class="add-row">
          <input type="text" id="newExpName" placeholder="Category name">
          <input type="number" id="newExpAmt" placeholder="Amount">
          <button class="small-btn" id="addExpense">Add</button>
        </div>
        <div class="hint">Total expenses: ${fmt(totalExpenses())} · Net cash flow: ${fmt(netCash())}</div>
      </div>
    </div>

    <div class="panel" id="panel-networth">
      <div class="two-col">
        <div class="card">
          <h2>Assets</h2>
          <div id="assetRows"></div>
          <div class="add-row">
            <input type="text" id="newAssetName" placeholder="Asset name">
            <input type="number" id="newAssetAmt" placeholder="Amount">
            <button class="small-btn" id="addAsset">Add</button>
          </div>
        </div>
        <div class="card">
          <h2>Liabilities</h2>
          <div id="liabRows"></div>
          <div class="add-row">
            <input type="text" id="newLiabName" placeholder="Liability name">
            <input type="number" id="newLiabAmt" placeholder="Amount">
            <button class="small-btn" id="addLiab">Add</button>
          </div>
        </div>
      </div>
      <div class="card"><h2>Net Worth: ${fmt(netWorth())}</h2></div>
    </div>

    <div class="panel" id="panel-goals">
      <div class="card">
        <h2>Goals</h2>
        <div id="goalRows"></div>
        <div class="add-row">
          <input type="text" id="newGoalName" placeholder="Goal name">
          <input type="number" id="newGoalTarget" placeholder="Target $">
          <input type="number" id="newGoalCurrent" placeholder="Current $">
          <input type="date" id="newGoalDate">
          <button class="small-btn" id="addGoal">Add</button>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-habits">
      <div class="card">
        <h2>This week's habits</h2>
        <div class="days-row head"><div>Habit</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div><div></div></div>
        <div id="habitRows"></div>
        <div class="add-row">
          <input type="text" id="newHabitName" placeholder="New habit">
          <button class="small-btn" id="addHabit">Add</button>
        </div>
        <div class="hint">Overall completion: ${Math.round(habitPct()*100)}%</div>
      </div>
    </div>
  `;

  // Expenses
  const expenseRows = $('#expenseRows');
  state.expenses.forEach(e=>{
    const row = document.createElement('div'); row.className='row';
    row.innerHTML = `<label>${e.name}</label><input type="number" value="${e.amt}" data-id="${e.id}" class="expAmt"><button class="small-btn danger" data-id="${e.id}" data-kind="expenses">×</button>`;
    expenseRows.appendChild(row);
  });

  // Assets
  const assetRows = $('#assetRows');
  state.assets.forEach(a=>{
    const row = document.createElement('div'); row.className='row';
    row.innerHTML = `<label>${a.name}</label><input type="number" value="${a.amt}" data-id="${a.id}" class="assetAmt"><button class="small-btn danger" data-id="${a.id}" data-kind="assets">×</button>`;
    assetRows.appendChild(row);
  });

  // Liabilities
  const liabRows = $('#liabRows');
  state.liabilities.forEach(l=>{
    const row = document.createElement('div'); row.className='row';
    row.innerHTML = `<label>${l.name}</label><input type="number" value="${l.amt}" data-id="${l.id}" class="liabAmt"><button class="small-btn danger" data-id="${l.id}" data-kind="liabilities">×</button>`;
    liabRows.appendChild(row);
  });

  // Goals
  const goalRows = $('#goalRows');
  state.goals.forEach(g=>{
    const pct = g.target>0 ? Math.min(g.current/g.target,1) : 0;
    const status = pct>=1?['Complete','status-complete']:pct>=0.5?['On Track','status-ontrack']:['Needs Attention','status-behind'];
    const row = document.createElement('div'); row.className='card'; row.style.marginBottom='10px'; row.style.padding='12px 14px';
    row.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <strong>${g.name}</strong>
        <span class="status-pill ${status[1]}">${status[0]}</span>
      </div>
      <div class="bar-track" style="margin-bottom:8px;"><div class="bar-fill" style="width:${pct*100}%"></div></div>
      <div class="row" style="border:none;">
        <label>Current</label><input type="number" value="${g.current}" data-id="${g.id}" class="goalCurrent">
        <label>Target</label><input type="number" value="${g.target}" data-id="${g.id}" class="goalTarget">
        <button class="small-btn danger" data-id="${g.id}" data-kind="goals">×</button>
      </div>`;
    goalRows.appendChild(row);
  });

  // Habits
  const habitRows = $('#habitRows');
  state.habits.forEach(h=>{
    const row = document.createElement('div'); row.className='days-row';
    row.innerHTML = `<div>${h.name}</div>` +
      h.days.map((d,i)=>`<input type="checkbox" ${d?'checked':''} data-id="${h.id}" data-day="${i}" class="habitCheck">`).join('') +
      `<button class="small-btn danger" data-id="${h.id}" data-kind="habits">×</button>`;
    habitRows.appendChild(row);
  });

  attachEvents();
}

function attachEvents(){
  // tabs
  $$('.tab').forEach(t=>t.addEventListener('click', ()=>{
    $$('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    $$('.panel').forEach(p=>p.classList.remove('active'));
    $(`#panel-${t.dataset.tab}`).classList.add('active');
  }));

  const incomeInput = $('#incomeInput');
  if(incomeInput) incomeInput.addEventListener('change', e=>{ state.income=Number(e.target.value)||0; save(); render(); reactivateTab('budget'); });

  $$('.expAmt').forEach(inp=>inp.addEventListener('change', e=>{
    const item = state.expenses.find(x=>x.id===e.target.dataset.id); if(item) item.amt=Number(e.target.value)||0;
    save(); render(); reactivateTab('budget');
  }));
  $$('.assetAmt').forEach(inp=>inp.addEventListener('change', e=>{
    const item = state.assets.find(x=>x.id===e.target.dataset.id); if(item) item.amt=Number(e.target.value)||0;
    save(); render(); reactivateTab('networth');
  }));
  $$('.liabAmt').forEach(inp=>inp.addEventListener('change', e=>{
    const item = state.liabilities.find(x=>x.id===e.target.dataset.id); if(item) item.amt=Number(e.target.value)||0;
    save(); render(); reactivateTab('networth');
  }));
  $$('.goalCurrent').forEach(inp=>inp.addEventListener('change', e=>{
    const item = state.goals.find(x=>x.id===e.target.dataset.id); if(item) item.current=Number(e.target.value)||0;
    save(); render(); reactivateTab('goals');
  }));
  $$('.goalTarget').forEach(inp=>inp.addEventListener('change', e=>{
    const item = state.goals.find(x=>x.id===e.target.dataset.id); if(item) item.target=Number(e.target.value)||0;
    save(); render(); reactivateTab('goals');
  }));
  $$('.habitCheck').forEach(inp=>inp.addEventListener('change', e=>{
    const item = state.habits.find(x=>x.id===e.target.dataset.id);
    if(item) item.days[Number(e.target.dataset.day)] = e.target.checked;
    save(); render(); reactivateTab('habits');
  }));

  $$('[data-kind]').forEach(btn=>{
    if(btn.tagName!=='BUTTON') return;
    btn.addEventListener('click', e=>{
      const kind = e.target.dataset.kind, id = e.target.dataset.id;
      state[kind] = state[kind].filter(x=>x.id!==id);
      save(); render(); reactivateTab(kind==='expenses'?'budget':kind==='assets'||kind==='liabilities'?'networth':kind);
    });
  });

  const addExpense = $('#addExpense');
  if(addExpense) addExpense.addEventListener('click', ()=>{
    const name = $('#newExpName').value.trim(); const amt = Number($('#newExpAmt').value)||0;
    if(!name) return;
    state.expenses.push({id:uid(),name,amt}); save(); render(); reactivateTab('budget');
  });
  const addAsset = $('#addAsset');
  if(addAsset) addAsset.addEventListener('click', ()=>{
    const name = $('#newAssetName').value.trim(); const amt = Number($('#newAssetAmt').value)||0;
    if(!name) return;
    state.assets.push({id:uid(),name,amt}); save(); render(); reactivateTab('networth');
  });
  const addLiab = $('#addLiab');
  if(addLiab) addLiab.addEventListener('click', ()=>{
    const name = $('#newLiabName').value.trim(); const amt = Number($('#newLiabAmt').value)||0;
    if(!name) return;
    state.liabilities.push({id:uid(),name,amt}); save(); render(); reactivateTab('networth');
  });
  const addGoal = $('#addGoal');
  if(addGoal) addGoal.addEventListener('click', ()=>{
    const name = $('#newGoalName').value.trim();
    const target = Number($('#newGoalTarget').value)||0;
    const current = Number($('#newGoalCurrent').value)||0;
    const date = $('#newGoalDate').value;
    if(!name) return;
    state.goals.push({id:uid(),name,target,current,date}); save(); render(); reactivateTab('goals');
  });
  const addHabit = $('#addHabit');
  if(addHabit) addHabit.addEventListener('click', ()=>{
    const name = $('#newHabitName').value.trim();
    if(!name) return;
    state.habits.push({id:uid(),name,days:[false,false,false,false,false,false,false]});
    save(); render(); reactivateTab('habits');
  });
}

function reactivateTab(name){
  $$('.tab').forEach(x=>x.classList.remove('active'));
  const t = $(`.tab[data-tab="${name}"]`); if(t) t.classList.add('active');
  $$('.panel').forEach(p=>p.classList.remove('active'));
  const p = $(`#panel-${name}`); if(p) p.classList.add('active');
}

(async function init(){
  await load();
  render();
})();
</script>
</body>
</html>
